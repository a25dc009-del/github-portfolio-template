<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>わたしのポートフォリオ</title>
<meta name="description" content="作品ポートフォリオ">
<!-- SNSでシェアされたときの見え方。画像はあとで差し替えてください -->
<meta property="og:title" content="わたしのポートフォリオ">
<meta property="og:type" content="website">
<meta property="og:image" content="http://akihiko.shirai.as/github-portfolio-template/images/HakaseOG.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <!-- ▼ ここから書き換えます -->
  <p class="course">Portfolio</p>
  <h1>荒井那智</h1>
  <p class="bio">
    デジタルハリウッド大学で3DCGの勉強をしつつ、自分の興味のある芸術について学んでいます。
  </p>
  <!-- ▲ ここまで -->
</header>

<main>
  <section>
    <h2>作品</h2>
    <div class="works">

      <!--
        作品を1つ増やすときは、この <figure> ... </figure> を
        まるごとコピーして貼り付け、中身を書き換えてください。
        画像は images/ フォルダに入れます。
      -->
      <figure class="work">
        <img src="images/huukei.png" alt="桜と少女">
        <figcaption>
          <h3>桜と少女</h3>
          <p class="meta">初めてのドット絵風景画</p>
          <p>ドット絵で線路際に咲く大きな桜を描きました。</p>
        </figcaption>
      </figure>

      <figure class="work">
        <img src="images/fireworks_summer.png" alt="森の中で夜空に打ち上がる花火を、制服姿で欠伸をしながら眺める女の子を描いたドット絵">
        <figcaption>
          <h3>花火と制服と欠伸と</h3>
          <p class="meta">夏の夜を感じさせる、涼しげで幻想的な風景を描いたドット絵作品です。</p>
          <p>ドット絵で、森の奥から夜空に打ち上がる花火と、それを興味なさそうに眺めながら欠伸をする女の子を描きました。夏の夜の静けさと、花火の華やかさとの対比を意識して制作しています。</p>
        </figcaption>
      </figure>

    </div>
  </section>
</main>

<footer>
  <p>荒井那智</p>
  <p class="note">
    このページの作品には、生成AIを用いて制作したものもあります。
    使用したツールとプロンプトは各作品に記載しています。
  </p>
</footer>

</body>
</html>
